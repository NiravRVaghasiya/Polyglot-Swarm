# Italian register / formality notes.
notes:
  - topic: tu vs Lei
    note: >
      Use tu with friends, family, and peers; use Lei (third-person singular)
      for strangers and in formal/professional settings.
    register: neutral
  - topic: voi as formal plural
    note: >
      Standard modern Italian uses voi for plural "you" in most contexts;
      historical/southern usage of voi as a formal singular is dated.
    register: neutral
