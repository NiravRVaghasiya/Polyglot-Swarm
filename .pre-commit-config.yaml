# Pre-commit hooks — run the same lint/format/type checks locally that CI runs.
# Install once with: pre-commit install
# Run against all files: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4  # keep in step with ruff in requirements.lock
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1  # keep in step with mypy in requirements.lock
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - pydantic>=2.9.0
          - pydantic-settings>=2.5.0
          - types-PyYAML>=6.0
