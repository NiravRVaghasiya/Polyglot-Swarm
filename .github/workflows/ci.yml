name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    env:
      # Force offline deterministic mode: no API keys, no network, no flakiness.
      POLYGLOT_DETERMINISTIC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (ruff)
        run: python -m ruff format --check .

      - name: Type-check (mypy)
        run: python -m mypy src

      - name: Test (pytest)
        run: python -m pytest

      - name: Benchmark harness (smoke)
        run: python -m benchmarks

      - name: Evaluation harness (grammar/vocabulary/assessment/curriculum)
        run: python -m evals

      # Real-model evaluation framework: offline checks only (dataset schema,
      # checksums, split leakage, strict typing). Real model calls run in
      # real-model-eval.yml, never here.
      - name: Real-model eval datasets (validate)
        run: python -m evals.real validate

      - name: Type-check real-model eval framework (mypy)
        run: python -m mypy --strict evals/real

  frontend:
    name: Frontend · Lint · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npm test
