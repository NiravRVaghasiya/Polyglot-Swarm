# Polyglot Swarm — local-first deployment.
#
#   docker compose up                          # API (:8000) + Gradio UI (:7860)
#   docker compose --profile web up            # also the React dashboard (:3000)
#   docker compose --profile local-llm up      # also an Ollama container (:11434);
#     then, once:  docker compose exec ollama ollama pull llama3.1:8b
#
# Copy .env.example to .env first and choose an LLM backend there (API key,
# Ollama, or POLYGLOT_DETERMINISTIC=1 for an offline demo).
#
# Every port is published on 127.0.0.1 only: the Gradio UI and Ollama have no
# authentication, so they must not be reachable from the network. To serve
# other machines, use docker-compose.prod.yml behind a TLS reverse proxy.

x-app-env: &app-env
  # Inside a container "localhost" is the container itself, so .env's
  # OLLAMA_BASE_URL can't reach Ollama. This points at the local-llm profile's
  # container; to use Ollama running on your own machine instead, change it to
  # http://host.docker.internal:11434
  OLLAMA_BASE_URL: http://ollama:11434

services:
  api:
    build: .
    image: polyglot-swarm
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      <<: *app-env
    volumes:
      - polyglot-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ui:
    # Reuse the image built by the api service. The Gradio app runs the tutor
    # in-process; it shares the data volume with the API rather than calling it.
    image: polyglot-swarm
    build: .
    command: python -m src.main
    ports:
      - "127.0.0.1:7860:7860"
    env_file:
      - .env
    environment:
      <<: *app-env
      GRADIO_SERVER_PORT: "7860"
      # Gradio listens on 127.0.0.1 by default, which is unreachable from
      # outside the container.
      GRADIO_SERVER_NAME: "0.0.0.0"
    volumes:
      - polyglot-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional React dashboard. Enable with: --profile web (first start installs
  # and builds, which takes a few minutes).
  web:
    image: node:24-alpine
    profiles: ["web"]
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run build && npm start"
    environment:
      # Used by the browser, so it is the API's address as seen from your machine.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/react_app:/app
      - web-node-modules:/app/node_modules
      - web-next-build:/app/.next
    depends_on:
      api:
        condition: service_healthy

  # Optional local LLM for privacy mode. Enable with: --profile local-llm
  ollama:
    image: ollama/ollama:0.40.15
    profiles: ["local-llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  polyglot-data:
  ollama-models:
  web-node-modules:
  web-next-build:
