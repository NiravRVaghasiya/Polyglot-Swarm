name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    env:
      # Force offline deterministic mode: no API keys, no network, no flakiness.
      POLYGLOT_DETERMINISTIC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Pinned to the tested versions (ADR-0035): the lockfile is a constraints file.
      - name: Install dependencies
        run: python -m pip install -c requirements.lock -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (ruff)
        run: python -m ruff format --check .

      - name: Type-check (mypy)
        run: python -m mypy src

      - name: Test (pytest)
        run: python -m pytest

      - name: Benchmark harness (smoke)
        run: python -m benchmarks

      - name: Evaluation harness (grammar/vocabulary/assessment/curriculum)
        run: python -m evals

      # Real-model evaluation framework: offline checks only (dataset schema,
      # checksums, split leakage, strict typing). Real model calls run in
      # real-model-eval.yml, never here.
      - name: Real-model eval datasets (validate)
        run: python -m evals.real validate

      - name: Type-check real-model eval framework (mypy)
        run: python -m mypy --strict evals/real

      # Adaptive-learning evaluation harness (ADR-0033): strict typing only.
      # Its unit tests run with the pytest step; the full simulated
      # evaluation (python -m evals.adaptive) is run on demand.
      - name: Type-check adaptive evaluation harness (mypy)
        run: python -m mypy --strict evals/adaptive

      # Speech benchmark harness (ADR-0034): strict typing only. Real-recogniser
      # runs need the voice extra and external audio, so they are on demand.
      - name: Type-check speech evaluation harness (mypy)
        run: python -m mypy --strict evals/speech

      # Migrations: a fresh database reaches the expected schema, intact.
      - name: Migration check
        run: |
          python -c "from src.memory import schema; schema.init_all()"
          python -m src.cli ops db-check

  security:
    name: Security · Secrets · Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: python -m pip install -c requirements.lock -e . ruff pip-audit

      - name: Secret scan (tracked files)
        run: python -m src.security.secret_scan

      # flake8-bandit rules. S101/S104/S311 are accepted project-wide
      # (asserts, the 0.0.0.0 container bind, non-crypto random for
      # pedagogy); every other finding is fixed or carries a reviewed noqa.
      - name: Static security lint (ruff S rules)
        run: python -m ruff check src --select S --ignore S101,S104,S311

      # Fails on any vulnerability not accepted, by exact version, in
      # ops/security/accepted-vulnerabilities.yml (with a review-by date).
      - name: Dependency vulnerability gate (pip-audit)
        run: python -m src.security.dependency_audit

  container:
    name: Container · Staging rehearsal
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      METRICS: ci-metrics-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t polyglot-swarm:ci .

      - name: Staging configuration
        run: |
          cat > .env.staging <<EOF
          APP_ENV=staging
          LOG_FORMAT=json
          API_DOCS_ENABLED=false
          CORS_ORIGINS=https://staging.example.org
          METRICS_TOKEN=${METRICS}
          LLM_GLOBAL_DAILY_BUDGET_USD=5
          OLLAMA_BASE_URL=http://127.0.0.1:11434
          RESTIC_REPOSITORY=rest:http://rest:8000/polyglot
          RESTIC_PASSWORD=ci-restic-password-0123456789
          EOF
          docker run --rm --env-file .env.staging polyglot-swarm:ci polyglot ops config-check

      - name: Start (migrates the schema) and check readiness
        run: |
          docker volume create polyglot-ci-data
          docker run -d --name api -p 8000:8000 --env-file .env.staging \
            -v polyglot-ci-data:/data --read-only --tmpfs /tmp -e HOME=/data/.home \
            polyglot-swarm:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/ready | tee ready.json
          python3 -c "import json; d=json.load(open('ready.json')); assert d['checks']['database']['ok'], d"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/docs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/metrics)" = 401
          curl -fsS -H "Authorization: Bearer ${METRICS}" localhost:8000/metrics | grep -q polyglot_build_info
          docker exec api id -u | grep -qv '^0$'   # not root
          # A learner account, so the backup and restore checks compare real rows.
          curl -fsS -X POST localhost:8000/api/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"username": "drill-learner", "password": "drill-password-123"}' >/dev/null

      - name: Backup, verify and restore inside the container
        run: |
          docker exec api polyglot ops backup --label ci
          SET=$(docker exec api sh -c 'ls -d /data/backups/polyglot-* | tail -1')
          docker exec api polyglot ops verify "$SET"
          docker stop api
          docker run --rm --env-file .env.staging -v polyglot-ci-data:/data -e HOME=/data/.home \
            polyglot-swarm:ci polyglot ops restore "$SET" --yes
          docker start api
          for i in $(seq 1 30); do curl -fsS localhost:8000/ready && break; sleep 2; done
          docker exec api polyglot ops db-check

      # ADR-0037: encrypted off-host copy to a throwaway REST server, then a
      # rebuild of a fresh volume (a lost host) from that copy alone.
      - name: Off-host copy and restore from it
        run: bash ops/backup/offsite-drill.sh
        env:
          IMAGE: polyglot-swarm:ci
          ENV_FILE: .env.staging
          VOLUME: polyglot-ci-data
          MIN_USERS: "1"

      - name: Restart is idempotent (no migration, no data change)
        run: |
          docker restart api
          for i in $(seq 1 30); do curl -fsS localhost:8000/ready && break; sleep 2; done
          docker logs api 2>&1 | tail -20

  frontend:
    name: Frontend · Lint · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies (lockfile)
        run: npm ci

      # Blocks on high or critical advisories in the shipped (non-dev)
      # dependencies. Next's bundled PostCSS is lifted to a patched release
      # by the `overrides` entry in package.json.
      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npm test

      - name: Production build
        run: npm run build
