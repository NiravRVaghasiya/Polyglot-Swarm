[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "polyglot-swarm"
version = "0.1.0"
description = "Multi-agent AI system for adaptive language learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Nirav Vaghasiya" },
]
keywords = ["ai", "language-learning", "multi-agent", "langgraph", "spaced-repetition", "fsrs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "fsrs>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "gradio>=5.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
voice = [
    "openai-whisper>=20231117",
    "livekit-agents>=0.8.0",
    "edge-tts>=6.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "types-PyYAML>=6.0",
]
all = ["polyglot-swarm[voice,dev]"]

[project.scripts]
polyglot = "src.cli:app"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/polyglot-swarm"
Repository = "https://github.com/YOUR_USERNAME/polyglot-swarm"
Issues = "https://github.com/YOUR_USERNAME/polyglot-swarm/issues"
Documentation = "https://github.com/YOUR_USERNAME/polyglot-swarm/tree/main/docs"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
