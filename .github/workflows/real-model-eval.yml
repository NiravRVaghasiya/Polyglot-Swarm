name: Real-model evaluation

# Expensive, billed, and non-deterministic: never runs on pushes or pull
# requests. The offline gates live in ci.yml. This workflow runs the real-model
# benchmark (evals/real) on demand or weekly and uploads the run directory
# (raw responses + manifest + report) as an artifact. It does not fail on
# quality: a run is a measurement, and regressions are judged with
# `python -m evals.real compare` against a stored baseline run.

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated provider[:model] specs"
        required: true
        default: "claude,openai,gemini"
      config:
        description: "Config name under evals/real/configs"
        required: true
        default: "default"
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: real-model-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Do NOT set POLYGLOT_DETERMINISTIC here: this job must hit real models.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -c requirements.lock -e ".[dev]"

      - name: Validate datasets
        run: python -m evals.real validate

      - name: Probe providers
        run: python -m evals.real probe ${PROVIDERS//,/ }
        env:
          PROVIDERS: ${{ github.event.inputs.providers || 'claude,openai,gemini' }}

      - name: Run benchmark
        id: run
        env:
          PROVIDERS: ${{ github.event.inputs.providers || 'claude,openai,gemini' }}
          CONFIG: ${{ github.event.inputs.config || 'default' }}
        run: |
          RUN_ID="ci-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python -m evals.real run --providers "$PROVIDERS" --config "$CONFIG" --run-id "$RUN_ID" || true

      - name: Report
        if: always()
        run: python -m evals.real report "${{ steps.run.outputs.run_id }}" --no-history || true

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-eval-${{ steps.run.outputs.run_id }}
          path: evals/real/runs/${{ steps.run.outputs.run_id }}
