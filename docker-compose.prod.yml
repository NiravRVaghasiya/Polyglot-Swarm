# Polyglot Swarm — staging/production stack (ADR-0035).
#
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yml run --rm api polyglot ops config-check
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the local docker-compose.yml:
# - only the API is published, and only on 127.0.0.1: put a TLS-terminating
#   reverse proxy (Caddy, nginx, a cloud load balancer) in front of it;
# - the Gradio UI is not run (it has no per-learner accounts; ADR-0035 R5);
# - a read-only root filesystem, no added capabilities, resource limits;
# - an hourly verified backup job (`backup`) and an hourly encrypted
#   off-host copy of those sets (`offsite`, restic; ADR-0037). The config
#   check refuses staging/production without RESTIC_REPOSITORY/RESTIC_PASSWORD.
# Staging uses this same file with APP_ENV=staging and its own .env file:
#   docker compose -f docker-compose.prod.yml --env-file .env.staging -p polyglot-staging up -d

x-app: &app
  build: .
  image: polyglot-swarm:${POLYGLOT_IMAGE_TAG:-latest}
  env_file:
    - ${POLYGLOT_ENV_FILE:-.env.production}
  environment:
    # The root filesystem is read-only; libraries that cache models under
    # ~/.cache (ChromaDB's embedding model) write to the data volume instead.
    HOME: /data/.home
  volumes:
    - polyglot-data:/data
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  api:
    <<: *app
    # Trust X-Forwarded-For only from the host's reverse proxy, which reaches
    # this 127.0.0.1-bound port through Docker's bridge (172.16.0.0/12). With
    # `*` uvicorn takes the client-supplied first entry, so the per-IP login
    # limit could be dodged. Another proxy address: set FORWARDED_ALLOW_IPS.
    command: >-
      uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers 1
      --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12}
      --timeout-graceful-shutdown 30
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    <<: *app
    # A verified backup set every BACKUP_INTERVAL_SECONDS (default 1 h, so
    # RPO 1 h); retention per BACKUP_RETENTION_COUNT. `$$` defers expansion
    # to the container, which reads the value from the env file.
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do polyglot ops backup --label scheduled || echo 'BACKUP FAILED'; sleep $${BACKUP_INTERVAL_SECONDS:-3600}; done"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512m}
    depends_on:
      api:
        condition: service_healthy

  offsite:
    # Encrypted off-host copies of /data/backups (ADR-0037, RR7). restic
    # encrypts client-side, so the storage provider never sees learner data.
    # Restore drill: docs/production/operations-runbook.md#off-host-copies
    image: restic/restic:0.19.1
    user: "10001:10001"
    entrypoint: ["/bin/sh", "/ops/offsite-backup.sh"]
    env_file:
      - ${POLYGLOT_ENV_FILE:-.env.production}
    environment:
      RESTIC_CACHE_DIR: /tmp/restic-cache
    volumes:
      - polyglot-data:/data
      - ./ops/backup/offsite-backup.sh:/ops/offsite-backup.sh:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512m}
    depends_on:
      backup:
        condition: service_started

volumes:
  polyglot-data:
