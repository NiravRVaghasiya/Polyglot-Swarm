# Polish register / formality notes.
notes:
  - topic: ty vs Pan/Pani
    note: >
      Use ty with friends, family, and peers. Use Pan (to a man) / Pani (to a
      woman) — with a third-person verb — for strangers and formal settings.
      Getting this wrong is a pragmatic error, not a grammatical one.
    register: neutral
  - topic: aspect choice
    note: >
      Choosing imperfective vs perfective changes meaning (ongoing vs completed),
      not just tense; it is a lexical/grammatical choice, not register.
    register: neutral
